# Lead Router Configuration v2.2
# Multi-gig support: Scraping, Bots, Extensions, Integrations, E-commerce
# Channels: Reddit (15 subreddits), IndieHackers, HN Who is Hiring, We Work Remotely, RemoteOK
# Rate limits respected: 500ms between Reddit requests, 1s for HN

channels:
  reddit:
    enabled: true
    type: api
    rate_limit_ms: 500  # Delay between subreddit requests
    subreddits:
      # Primary hiring subreddits
      - name: "forhire"
        keywords: ["[hiring]", "developer", "python", "scraper", "automation", "bot", 
                   "extension", "integration", "discord", "telegram", "api", "shopify", "freelance"]
        min_budget_hint: 200
      - name: "slavelabour"
        keywords: ["[task]", "scraper", "automation", "script", "bot", "simple", "quick"]
      - name: "webdev"
        keywords: ["[hiring]", "javascript", "chrome extension", "api", 
                   "developer", "integration", "webhook", "frontend", "react"]
      - name: "Python"
        keywords: ["[hiring]", "python", "scraper", "automation", "script", 
                   "bot", "discord", "telegram", "django", "flask"]
      
      # Bot/Extension specific
      - name: "discord_bots"
        keywords: ["[hiring]", "bot", "discord", "automation", "telegram", "slack"]
      - name: "Shopify_App_Dev"
        keywords: ["[hiring]", "shopify", "app", "integration", "api", "ecommerce"]
      
      # Project/MVP focused
      - name: "sideproject"
        keywords: ["looking for", "need help", "developer", "build", "mvp", "automation"]
      - name: "startups"
        keywords: ["looking for", "need developer", "build", "mvp", "prototype", "beta"]
      
      # Alternative hiring
      - name: "jobbit"
        keywords: ["[hiring]", "remote", "python", "automation", "scraper", "bot", "contract"]
      - name: "hireaprogrammer"
        keywords: ["[hiring]", "developer", "programmer", "script", "automation", "bot", "extension"]
      
      # Small tasks / quick gigs
      - name: "beermoney"
        keywords: ["[hiring]", "script", "automation", "bot", "scraper", "tool"]
      - name: "WorkOnline"
        keywords: ["[hiring]", "remote", "developer", "freelance", "contract", "python"]
      
      # Specialized
      - name: "javascript"
        keywords: ["[hiring]", "javascript", "typescript", "node", "react", "extension"]
      - name: "datascience"
        keywords: ["[hiring]", "python", "scraper", "data", "automation", "api", "pandas"]
      - name: "web_design"
        keywords: ["[hiring]", "web", "developer", "frontend", "javascript", "shopify"]
      - name: "SmallBusiness"
        keywords: ["looking for", "need help", "automation", "website", "shopify", "integration"]
    
  indiehackers:
    enabled: true
    type: rss
    feeds:
      - name: "looking-for-builder"
        url: "https://www.indiehackers.com/rss"
        keywords: ["looking for", "need developer", "build an app", "automation", 
                   "scraper", "mvp", "bot", "integration", "api", "webhook",
                   "chrome extension", "discord", "telegram", "shopify"]

  # Low-hanging fruit - no auth required
  hn:
    enabled: true
    type: api
    rate_limit_ms: 1000
    description: "Hacker News Who is Hiring monthly thread"
    
  weworkremotely:
    enabled: true
    type: rss
    description: "We Work Remotely - remote job board"
    
  remoteok:
    enabled: true
    type: api
    rate_limit_ms: 500
    description: "RemoteOK - remote jobs with salary info"

qualification:
  min_score: 40  # Out of 100
  
  criteria:
    ai_doable:
      weight: 50
      indicators:
        # Universal
        - "clear requirements"
        - "well-defined scope"
        - "specific"
        - "documentation provided"
        - "mockups"
        - "examples"
        # Scraping
        - "csv"
        - "json"
        - "excel"
        - "structured data"
        - "export"
        - "parse"
        - "selector"
        - "xpath"
        # Bots
        - "api token"
        - "webhook"
        - "slash command"
        - "message handler"
        - "notification"
        # Extensions
        - "popup"
        - "content script"
        - "background script"
        - "manifest v3"
        # Integrations
        - "oauth"
        - "api key"
        - "endpoint"
        - "payload"
        - "rest api"
        - "graphql"
      avoid:
        - "rust"
        - "c++"
        - "embedded"
        - "systems"
        - "consultant"
        - "advisor"
        - "strategy"
        - "full-time position"
        - "part-time employee"
      
    tech_stack:
      weight: 25
      preferred:
        - "python"
        - "javascript"
        - "typescript"
        - "js"
        - "ts"
        - "node"
        - "node.js"
      tools:
        scraping:
          - "beautifulsoup"
          - "scrapy"
          - "selenium"
          - "playwright"
          - "requests"
        bot:
          - "discord.py"
          - "telebot"
          - "python-telegram-bot"
          - "slack-sdk"
          - "discord.js"
        extension:
          - "chrome"
          - "manifest"
          - "content script"
          - "popup"
        integration:
          - "n8n"
          - "zapier"
          - "make.com"
          - "webhook"
          - "rest api"
          - "graphql"
        ecommerce:
          - "shopify api"
          - "woocommerce api"
          - "liquid"
          - "php"
      avoid:
        - "rust"
        - "c++"
        - "c#"
        - "embedded"
        - "systems"
        - "low-level"
        
    urgency:
      weight: 10
      signals:
        - "asap"
        - "urgent"
        - "immediately"
        - "quick turnaround"
        - "this week"
        - "today"
        - "deadline"
        - "rush"
          
    payment_tier:
      weight: 15
      tiers:
        - pattern: '\$[\d,]+(k|K)?'
          score: 100
        - pattern: '\$\d{3,}'
          score: 80
        - pattern: '\$\d{2}'
          score: 60
        - pattern: '\$\d+'
          score: 40
        - pattern: 'paid|pay|budget|compensation|rate|hourly|fixed price'
          score: 30

# Gig type scoring bonuses
gig_types:
  scraping:
    emoji: "🕷️"
    name: "Data Scraping"
    keywords: ["scrape", "scraping", "extract", "crawl", "data extraction"]
  bot:
    emoji: "🤖"
    name: "Bot Development"
    keywords: ["discord bot", "telegram bot", "slack bot", "chatbot"]
  extension:
    emoji: "🧩"
    name: "Browser Extension"
    keywords: ["chrome extension", "browser extension", "firefox addon"]
  integration:
    emoji: "🔗"
    name: "API Integration"
    keywords: ["api integration", "webhook", "rest api", "n8n", "zapier"]
  ecommerce:
    emoji: "🛒"
    name: "E-commerce"
    keywords: ["shopify", "woocommerce", "etsy", "ecommerce"]
  automation:
    emoji: "⚙️"
    name: "Automation"
    keywords: ["automation", "automate", "script", "cron job"]

# Outreach Templates by Platform
outreach_templates:
  reddit_forhire:
    tone: "Casual, direct, no corporate speak"
    structure:
      - "Hook: Acknowledge the gig specifically"
      - "Proof: 1-2 sentences about similar work"
      - "Offer: What you can do + timeline"
      - "CTA: DM to discuss"
    hot_offer: true  # Can include code sample/demo
    
  reddit_slavelabour:
    tone: "Very casual, quick, to the point"
    structure:
      - "Hook: Short ack"
      - "Proof: One-liner"
      - "Offer: Price + delivery time"
      - "CTA: DM"
    hot_offer: true
    
  reddit_startups:
    tone: "Professional but friendly, business-focused"
    structure:
      - "Hook: Comment on business value"
      - "Proof: Relevant startup/MVP experience"
      - "Offer: How you can help them grow"
      - "CTA: Call or email"
    hot_offer: true
    
  indiehackers:
    tone: "Founder-to-founder, business value focused"
    structure:
      - "Hook: Acknowledge the pain point"
      - "Proof: Similar founder project"
      - "Offer: Solution that scales"
      - "CTA: Book a call"
    hot_offer: true
    
  hn_whoishiring:
    tone: "Professional, technical, concise"
    structure:
      - "Hook: Reference specific tech stack"
      - "Proof: Relevant technical work"
      - "Offer: Availability + skills match"
      - "CTA: Email or GitHub"
    hot_offer: false
    
  remoteok:
    tone: "Professional, remote-work oriented"
    structure:
      - "Hook: Match their requirements"
      - "Proof: Remote work experience"
      - "Offer: Skills + availability"
      - "CTA: Apply or email"
    hot_offer: false

delivery:
  times:
    - "09:00"
    - "14:00"
  timezone: "Asia/Almaty"
  min_leads_per_batch: 3
  max_leads_per_batch: 10
  
# Hot Offers - Result-based demos (not code)
# Show working demos, data samples, videos - not code snippets
hot_offers:
  scraping:
    demo_type: "csv_sample"      # Attach 5-10 rows of real data
    time_investment: "15-30min"  # Time to prepare demo
    min_budget: 200              # Only for $200+ gigs
    
  bot:
    demo_type: "working_bot"     # Deployed demo bot to test
    time_investment: "30-60min"
    min_budget: 200
    
  extension:
    demo_type: "installable_zip" # ZIP with working extension
    time_investment: "30-45min"
    min_budget: 200
    
  integration:
    demo_type: "webhook_demo"    # Working webhook endpoint
    time_investment: "45-90min"
    min_budget: 300
    
  ecommerce:
    demo_type: "video_demo"      # Loom video of automation
    time_investment: "60-120min"
    min_budget: 300
    
  mvp:
    demo_type: "micro_mvp"       # Working prototype
    time_investment: "2-4hours"
    min_budget: 500
