# Lead Router Configuration v2.0
# Multi-gig support: Scraping, Bots, Extensions, Integrations, E-commerce

channels:
  upwork:
    enabled: true
    type: rss
    feeds:
      - name: "web-scraping"
        url: "https://www.upwork.com/nx/jobs/search/?q=python+scraper&sort=recency&rss=true"
        keywords: ["scraper", "scraping", "crawl", "extract data", "automation", "bot", "chrome extension"]
      - name: "bot-development"
        url: "https://www.upwork.com/nx/jobs/search/?q=discord+bot+telegram&sort=recency&rss=true"
        keywords: ["discord bot", "telegram bot", "slack bot", "chatbot", "bot development"]
      - name: "chrome-extensions"
        url: "https://www.upwork.com/nx/jobs/search/?q=chrome+extension&sort=recency&rss=true"
        keywords: ["chrome extension", "browser extension", "firefox addon", "manifest v3"]
      - name: "api-integration"
        url: "https://www.upwork.com/nx/jobs/search/?q=api+integration&sort=recency&rss=true"
        keywords: ["api integration", "webhook", "rest api", "third party api", "connect"]
      - name: "automation-workflow"
        url: "https://www.upwork.com/nx/jobs/search/?q=n8n+make+zapier&sort=recency&rss=true"
        keywords: ["n8n", "make.com", "zapier", "workflow automation", "automate"]
      - name: "shopify-apps"
        url: "https://www.upwork.com/nx/jobs/search/?q=shopify+app&sort=recency&rss=true"
        keywords: ["shopify", "shopify app", "woocommerce", "ecommerce integration"]
    
  reddit:
    enabled: true
    type: api
    subreddits:
      - name: "forhire"
        keywords: ["[hiring]", "developer", "python", "scraper", "automation", "bot", 
                   "extension", "integration", "discord", "telegram", "api", "shopify"]
        min_budget_hint: 200
      - name: "slavelabour"
        keywords: ["[task]", "scraper", "automation", "script", "bot", "simple"]
      - name: "webdev"
        keywords: ["[hiring]", "javascript", "chrome extension", "api", 
                   "developer", "integration", "webhook"]
      - name: "Python"
        keywords: ["[hiring]", "scraper", "automation", "script", "bot", 
                   "discord", "telegram", "api"]
      - name: "discord_bots"
        keywords: ["[hiring]", "bot", "discord", "automation"]
      - name: "Shopify_App_Dev"
        keywords: ["[hiring]", "shopify", "app", "integration", "api"]
      - name: "sideproject"
        keywords: ["looking for", "need help", "developer", "build", "mvp", "automation"]
      - name: "jobbit"
        keywords: ["[hiring]", "remote", "python", "automation", "scraper", "bot"]
    
  indiehackers:
    enabled: true
    type: rss
    feeds:
      - name: "looking-for-builder"
        url: "https://www.indiehackers.com/rss"
        keywords: ["looking for", "need developer", "build an app", "automation", 
                   "scraper", "mvp", "bot", "integration", "api", "webhook",
                   "chrome extension", "discord", "telegram", "shopify"]

qualification:
  min_score: 40  # Out of 100
  
  criteria:
    ai_doable:
      weight: 50
      indicators:
        # Universal
        - "clear requirements"
        - "well-defined scope"
        - "specific"
        - "documentation provided"
        - "mockups"
        - "examples"
        # Scraping
        - "csv"
        - "json"
        - "excel"
        - "structured data"
        - "export"
        - "parse"
        - "selector"
        - "xpath"
        # Bots
        - "api token"
        - "webhook"
        - "slash command"
        - "message handler"
        - "notification"
        # Extensions
        - "popup"
        - "content script"
        - "background script"
        - "manifest v3"
        # Integrations
        - "oauth"
        - "api key"
        - "endpoint"
        - "payload"
        - "rest api"
        - "graphql"
      avoid:
        - "rust"
        - "c++"
        - "embedded"
        - "systems"
        - "consultant"
        - "advisor"
        - "strategy"
        - "full-time position"
        - "part-time employee"
      
    tech_stack:
      weight: 25
      preferred:
        - "python"
        - "javascript"
        - "typescript"
        - "js"
        - "ts"
        - "node"
        - "node.js"
      tools:
        scraping:
          - "beautifulsoup"
          - "scrapy"
          - "selenium"
          - "playwright"
          - "requests"
        bot:
          - "discord.py"
          - "telebot"
          - "python-telegram-bot"
          - "slack-sdk"
          - "discord.js"
        extension:
          - "chrome"
          - "manifest"
          - "content script"
          - "popup"
        integration:
          - "n8n"
          - "zapier"
          - "make.com"
          - "webhook"
          - "rest api"
          - "graphql"
        ecommerce:
          - "shopify api"
          - "woocommerce api"
          - "liquid"
          - "php"
      avoid:
        - "rust"
        - "c++"
        - "c#"
        - "embedded"
        - "systems"
        - "low-level"
        
    urgency:
      weight: 10
      signals:
        - "asap"
        - "urgent"
        - "immediately"
        - "quick turnaround"
        - "this week"
        - "today"
        - "deadline"
        - "rush"
          
    payment_tier:
      weight: 15
      tiers:
        - pattern: '\$[\d,]+(k|K)?'
          score: 100
        - pattern: '\$\d{3,}'
          score: 80
        - pattern: '\$\d{2}'
          score: 60
        - pattern: '\$\d+'
          score: 40
        - pattern: 'paid|pay|budget|compensation|rate|hourly|fixed price'
          score: 30

# Gig type scoring bonuses
gig_types:
  scraping:
    emoji: "🕷️"
    name: "Data Scraping"
    keywords: ["scrape", "scraping", "extract", "crawl", "data extraction"]
  bot:
    emoji: "🤖"
    name: "Bot Development"
    keywords: ["discord bot", "telegram bot", "slack bot", "chatbot"]
  extension:
    emoji: "🧩"
    name: "Browser Extension"
    keywords: ["chrome extension", "browser extension", "firefox addon"]
  integration:
    emoji: "🔗"
    name: "API Integration"
    keywords: ["api integration", "webhook", "rest api", "n8n", "zapier"]
  ecommerce:
    emoji: "🛒"
    name: "E-commerce"
    keywords: ["shopify", "woocommerce", "etsy", "ecommerce"]
  automation:
    emoji: "⚙️"
    name: "Automation"
    keywords: ["automation", "automate", "script", "cron job"]

delivery:
  times:
    - "09:00"
    - "14:00"
  timezone: "Asia/Almaty"
  min_leads_per_batch: 3
  max_leads_per_batch: 10
